<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MQTT Sensor Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <header>
      <h1>MQTT Sensor Dashboard</h1>
      <div class="header-actions">
        <div class="status" id="status">🔴 Disconnected</div>
        <button id="toggleViewBtn" class="compact-toggle" hidden>Show sensor-only view</button>
      </div>
    </header>

    <section class="controls" id="brokerSection">
      <label>
        Broker URL
        <input type="text" id="brokerUrl" placeholder="mqtt://broker.example.com" />
      </label>
      <label>
        Port
        <input type="text" id="brokerPort" placeholder="1883" />
      </label>
      <label>
        Username
        <input type="text" id="brokerUsername" placeholder="optional" />
      </label>
      <label>
        Password
        <input type="password" id="brokerPassword" placeholder="optional" />
      </label>
      <div class="button-group">
        <button id="connectBtn">Connect</button>
        <button id="disconnectBtn">Disconnect</button>
      </div>
    </section>

    <section class="topics" id="topicsSection">
      <div class="topics-header">
        <h2>Subscribed Topics</h2>
      </div>
      <div class="topic-editor">
        <input type="text" id="newTopic" placeholder="e.g. /iot/esp32/+/telemetry" />
        <button id="addTopicBtn">Add Topic</button>
      </div>
      <div class="topic-tags" id="topicTags"></div>
    </section>

    <section class="grid" id="sensorGrid">
      <!-- Sensor cards injected here -->
    </section>

    <section class="graphs-section" id="graphsSection">
      <h2>Sensor Graphs <span class="graph-window-label">(10 min window)</span></h2>
      <div class="graphs-grid" id="graphsGrid">
        <!-- Chart canvases injected here -->
      </div>
    </section>

    <section class="log" id="logSection">
      <h2>Live MQTT Log</h2>
      <ul id="mqttLog"></ul>
    </section>
  </div>

  <script type="module" src="app.js"></script>
</body>

</html>
