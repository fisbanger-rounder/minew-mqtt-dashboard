name: Deploy MQTT Dashboard

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build & deploy
        run: |
          cd /opt/mqtt-dashboard/mqtt-dashboard
          git pull origin main
          docker compose up -d --build

      - name: Health check
        run: |
          sleep 5
          curl -sf http://localhost:4001 > /dev/null && echo "✅ Dashboard is live" || echo "❌ Health check failed"